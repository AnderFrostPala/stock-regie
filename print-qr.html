<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurboStock — Impression Étiquettes QR (HD & Lisibilité Max)</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f1f3f7;
      color: #000;
      padding: 10px;
    }
    
    .no-print {
      max-width: 900px;
      margin: 0 auto 15px auto;
      background: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-print {
      background: #e62b33;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.9em;
      cursor: pointer;
    }

    /* Grille écran */
    .labels-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      max-width: 1050px;
      margin: 0 auto;
    }

    .label-card {
      border: 1px dashed #6b7280;
      background: #fff;
      padding: 4px 2px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .label-header {
      font-size: 0.48em;
      font-weight: 800;
      color: #e62b33;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      line-height: 1;
      margin-bottom: 2px;
    }

    .label-nom {
      font-size: 0.62em;
      font-weight: 800;
      line-height: 1.1;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
      padding: 0 2px;
    }

    /* Conteneur avec marge blanche de sécurité (Quiet Zone) */
    .label-qr-wrap {
      width: 80px;
      height: 80px;
      background: #ffffff;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin: 1px 0;
    }
    /* Rendu net sans lissage baveux */
    .label-qr-wrap canvas,
    .label-qr-wrap img {
      width: 76px !important;
      height: 76px !important;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      display: block;
    }

    .label-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58em;
      font-weight: 700;
      background: #f1f3f7;
      border: 1px solid #d1d5db;
      padding: 1px 3px;
      border-radius: 3px;
      margin-top: 2px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* --- PARAMÈTRES D'IMPRESSION A4 --- */
    @page {
      size: A4 portrait;
      margin: 6mm 5mm;
    }

    @media print {
      html, body {
        background: #fff !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
      }
      .no-print {
        display: none !important;
      }
      .labels-grid {
        display: grid !important;
        grid-template-columns: repeat(6, 32mm) !important;
        gap: 2mm 1.5mm !important;
        justify-content: center !important;
        max-width: none !important;
        margin: 0 auto !important;
        width: 100% !important;
      }
      .label-card {
        width: 32mm !important;
        height: 35mm !important;
        border: 0.5px dashed #9ca3af !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        padding: 1.5mm 1mm 1.5mm 1mm !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        align-items: center !important;
      }
      .label-header {
        font-size: 5pt !important;
        margin-bottom: 0.4mm !important;
      }
      .label-nom {
        font-size: 6.2pt !important;
        line-height: 1 !important;
        margin-bottom: 0.8mm !important;
      }
      .label-qr-wrap {
        width: 21mm !important;
        height: 21mm !important;
        padding: 0.5mm !important;
        flex-shrink: 0 !important;
        margin: 0 auto !important;
      }
      .label-qr-wrap canvas,
      .label-qr-wrap img {
        width: 20mm !important;
        height: 20mm !important;
      }
      .label-id {
        font-size: 5.5pt !important;
        padding: 0.4mm 1mm !important;
        margin-top: 0.5mm !important;
      }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <div>
      <strong>Planche d'impression TurboStock (Haute Lisibilité Optique)</strong>
      <div style="font-size:0.75em; color:#666;">QR codes générés en haute définition (200 px natifs)</div>
    </div>
    <button class="btn-print" onclick="window.print()">🖨️ Imprimer les étiquettes</button>
  </div>

  <div class="labels-grid" id="container">
    <div style="grid-column: 1 / -1; text-align: center; padding: 40px;">Chargement du parc matériel...</div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyr8qcBeM-V1sEBd8IX207mqJxyB_ibhrl_q7ST2uHCrgGPQOQ8CNyc5aogTBoZ1N1T/exec";

    function extraireNomCourt(item) {
      if (item.ref && item.ref.trim() !== "" && item.ref !== "-" && !item.ref.startsWith("_")) {
        return item.ref.trim();
      }

      let nom = (item.nom || item.designation || "").trim();
      if (!nom) return item.id;

      nom = nom.replace(/^(Console|Projecteur|Micro|Enceinte|Ampli|Câble dmx|Câble)\s+/i, "");
      nom = nom.split(/\s*(\+|\/|\(|\b\d+\s*in\b|\b\d+\s*out\b)/i)[0].trim();

      return nom || item.id;
    }

    fetch(`${SCRIPT_URL}?action=getAll`)
      .then(r => r.json())
      .then(res => {
        const container = document.getElementById("container");
        container.innerHTML = "";
        
        if (!res.success || !res.items || res.items.length === 0) {
          container.innerHTML = "<p>Aucun matériel trouvé dans la feuille.</p>";
          return;
        }

        res.items.forEach((item, index) => {
          if (!item.id || item.id === "_000") return;

          const nomCourt = extraireNomCourt(item);

          const card = document.createElement("div");
          card.className = "label-card";

          const qrBoxId = `qrcode-${index}`;
          const urlScan = `https://anderfrostpala.github.io/stock-regie/index.html?id=${encodeURIComponent(item.id)}`;

          card.innerHTML = `
            <div>
              <div class="label-header">TurboStock</div>
              <div class="label-nom" title="${item.nom || nomCourt}">${nomCourt}</div>
            </div>
            <div class="label-qr-wrap" id="${qrBoxId}"></div>
            <div class="label-id">${item.id}</div>
          `;
          container.appendChild(card);

          // Génération en 200x200px (netteté maximale) + Correction Level L (motif simplifié)
          new QRCode(document.getElementById(qrBoxId), {
            text: urlScan,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.L
          });
        });
      })
      .catch(err => {
        document.getElementById("container").innerHTML = `<p style="color:red">Erreur chargement : ${err}</p>`;
      });
  </script>
</body>
</html>
