<style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 10px;
      background: #f1f3f7;
      color: #000;
    }
    
    .no-print {
      max-width: 1000px;
      margin: 0 auto 15px auto;
      background: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-print {
      background: #e62b33;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.9em;
      cursor: pointer;
    }

    /* Grille écran */
    .labels-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      max-width: 1050px;
      margin: 0 auto;
    }

    .label-card {
      border: 1px dashed #6b7280;
      background: #fff;
      padding: 4px 2px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-sizing: border-box;
    }

    .label-header {
      font-size: 0.5em;
      font-weight: 800;
      color: #e62b33;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      margin-bottom: 1px;
    }

    .label-nom {
      font-size: 0.65em;
      font-weight: 800;
      margin: 0 0 2px 0;
      line-height: 1.1;
      height: 2.2em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .label-qr-wrap {
      width: 75px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1px 0;
    }
    .label-qr-wrap canvas,
    .label-qr-wrap img {
      width: 75px !important;
      height: 75px !important;
    }

    .label-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62em;
      font-weight: 700;
      background: #f1f3f7;
      border: 1px solid #d1d5db;
      padding: 1px 4px;
      border-radius: 3px;
      margin-top: 1px;
      word-break: break-all;
    }

    /* RÈGLES D'IMPRESSION CALIBRÉES POUR ÉCONOMISER LE PAPIER */
    @page {
      size: A4 portrait;
      margin: 8mm 6mm; /* Marges réduites pour utiliser toute la feuille */
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      /* Flexbox dense au lieu de Grid pour supprimer les pages blanches prématurées */
      .labels-grid {
        display: flex !important;
        flex-wrap: wrap !important;
        justify-content: flex-start !important;
        gap: 3mm 2mm !important;
        width: 100% !important;
        max-width: none !important;
      }
      .label-card {
        width: 19.2% !important; /* Exactement 5 étiquettes par ligne */
        border: 0.6px dashed #9ca3af !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        margin: 0 !important;
        padding: 2mm 1mm !important;
      }
    }
  </style>
