<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Régie - Planning & Réservations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    
    :root {
      --bg-body: #0d0f12;
      --bg-surface: #171a21;
      --bg-surface-elevated: #20242e;
      --border: #292e3b;
      --text-main: #f1f3f7;
      --text-muted: #8b949e;
      --status-dispo: #10b981;
      --status-sorti: #ef4444;
      --status-blue: #2563eb;
      --status-blue-light: #3b82f6;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      margin: 0 auto; max-width: 600px;
      background-color: var(--bg-body); color: var(--text-main);
      padding: 14px; -webkit-font-smoothing: antialiased;
    }

    /* HEADER */
    .app-header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .brand-group { display: flex; align-items: center; gap: 10px; }
    .brand-logo { height: 36px; max-width: 70px; object-fit: contain; }
    .brand-fallback {
      background: #fff; color: #000; font-weight: 900; font-size: 0.65em;
      line-height: 1; padding: 5px 6px; border-radius: 4px;
    }
    .brand-text h1 { margin: 0; font-size: 0.95em; font-weight: 800; color: #fff; }
    .brand-text span { display: block; font-size: 0.72em; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    
    .user-pill-btn {
      display: flex; align-items: center; gap: 7px; background: var(--bg-surface);
      border: 1px solid var(--border); padding: 6px 10px; border-radius: 20px;
      color: var(--text-main); cursor: pointer; font-size: 0.82em; font-weight: 600; font-family: inherit;
    }

    /* MENU UTILISATEUR */
    #userMenu {
      position: absolute; right: 14px; top: 62px; width: 220px;
      background: var(--bg-surface-elevated); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 0; z-index: 1000; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .menu-header { padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 0.8em; color: var(--text-muted); }
    .menu-item {
      display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 14px;
      background: none; border: none; color: var(--text-main); text-align: left;
      font-size: 0.86em; cursor: pointer; text-decoration: none; font-family: inherit;
    }
    .menu-item:hover { background: rgba(255,255,255,0.06); }
    .menu-item.danger { color: var(--status-sorti); }

    /* NAVIGATION */
    .quick-nav { display: flex; gap: 6px; margin-bottom: 14px; }
    .quick-nav a {
      flex: 1; text-align: center; padding: 7px 4px; border-radius: 6px;
      background: var(--bg-surface); border: 1px solid var(--border);
      color: var(--text-muted); text-decoration: none; font-size: 0.78em; font-weight: 700;
    }
    .quick-nav a.active { color: #fff; border-color: #4b5563; background: var(--bg-surface-elevated); }

    .card {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; margin-bottom: 14px;
    }
    h3 { margin-top: 0; margin-bottom: 12px; font-size: 0.98em; color: #fff; font-weight: 800; }

    /* ACCORDÉON MES RÉSERVATIONS */
    .accordion-toggle {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      background: none; border: none; color: #60a5fa; font-size: 0.92em; font-weight: 700;
      cursor: pointer; padding: 0; text-align: left; font-family: inherit;
    }
    .accordion-content {
      margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); display: block;
    }

    /* FORMULAIRE & DATE */
    label { font-size: 0.76em; color: var(--text-muted); font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 4px; }
    input[type="text"], input[type="date"] {
      width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: #0d0f12; color: #fff; font-size: 14px; font-family: inherit; margin-bottom: 10px;
    }
    input:focus { outline: none; border-color: var(--status-blue-light); }
    .date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }

    /* RECHERCHE ET SÉLECTION */
    .search-box {
      width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border);
      background: #090a0d; color: #fff; font-size: 13px; font-family: inherit; margin-bottom: 10px;
    }
    .selection-counter {
      font-size: 0.8em; font-weight: 700; color: var(--status-blue-light); text-align: right; margin-bottom: 6px;
    }

    /* ARBORESCENCE DÉPLIABLE (CATÉGORIES & SOUS-CATÉGORIES) */
    .picker-box {
      max-height: 380px; overflow-y: auto; background: #090a0d; border: 1px solid var(--border);
      border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 6px;
    }

    details.cat-group {
      background: #12151c; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    }
    details.cat-group summary {
      padding: 9px 12px; font-size: 0.86em; font-weight: 800; color: #fff;
      cursor: pointer; user-select: none; background: #161922; display: flex;
      justify-content: space-between; align-items: center; list-style: none;
    }
    details.cat-group summary::-webkit-details-marker { display: none; }
    details.cat-group summary::after { content: "▼"; font-size: 0.75em; color: var(--text-muted); transition: transform 0.2s; }
    details.cat-group[open] summary::after { transform: rotate(180deg); }

    details.subcat-group {
      margin: 6px 8px 6px 14px; border-left: 2px solid #2d3342; padding-left: 8px;
    }
    details.subcat-group summary {
      padding: 4px 6px; font-size: 0.8em; font-weight: 700; color: #94a3b8;
      cursor: pointer; user-select: none; background: none; display: flex;
      justify-content: space-between; align-items: center; list-style: none;
    }
    details.subcat-group summary::-webkit-details-marker { display: none; }
    details.subcat-group summary::after { content: "▸"; font-size: 0.8em; color: var(--text-muted); transition: transform 0.2s; }
    details.subcat-group[open] summary::after { transform: rotate(90deg); }

    .picker-item {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 5px;
      font-size: 0.82em; cursor: pointer; user-select: none; margin-left: 4px;
    }
    .picker-item:hover { background: #1a1e27; }
    .picker-item input[type="checkbox"] { margin: 0; cursor: pointer; }

    .code-tag {
      font-family: 'JetBrains Mono', monospace; font-size: 0.8em; font-weight: 700;
      color: #38bdf8; background: #000; padding: 1px 5px; border-radius: 3px;
    }

    .btn-submit {
      width: 100%; padding: 13px; background: var(--status-blue); color: #fff;
      border: none; border-radius: 8px; font-weight: 800; font-size: 0.95em; cursor: pointer;
      font-family: inherit; margin-top: 14px; transition: background 0.15s ease;
    }
    .btn-submit:hover { background: #1d4ed8; }

    /* RÉSERVATIONS EN COURS */
    .resa-row {
      background: #0d0f12; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .btn-del {
      background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3);
      padding: 6px 10px; border-radius: 6px; font-size: 0.78em; font-weight: 700; cursor: pointer;
    }
    .btn-del:hover { background: rgba(239,68,68,0.25); }
  </style>
</head>
<body onclick="fermerMenuSiClicExterieur(event)">

  <!-- HEADER -->
  <header class="app-header">
    <div class="brand-group">
      <img src="logo-dnmade.png" alt="Logo DNMADe" class="brand-logo" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
      <div id="logoFallback" class="brand-fallback" style="display:none;">DN<br>MADE</div>
      <div class="brand-text">
        <h1>Suivi de Stock</h1>
        <span>DNMADe Marseille</span>
      </div>
    </div>
    <button type="button" class="user-pill-btn" onclick="toggleUserMenu(event)">
      <span style="width:7px; height:7px; border-radius:50%; background:var(--status-dispo);"></span>
      <span id="userName">...</span>
      <span style="font-size:0.7em; color:var(--text-muted);">▼</span>
    </button>
  </header>

  <!-- MENU DÉROULANT UTILISATEUR -->
  <div id="userMenu">
    <div class="menu-header">Profil : <strong id="userRoleTxt">Étudiant</strong></div>
    <a href="reservation.html" class="menu-item"><span>📅</span> Mes réservations</a>
    <div id="adminMenuOptions" style="display:none;">
      <a href="admin.html" class="menu-item" style="color:#f87171;"><span>⚙️</span> Panneau Admin</a>
      <a href="express.html" class="menu-item" style="color:#fbbf24;"><span>⚡</span> Mode Camion Express</a>
    </div>
    <button type="button" class="menu-item danger" onclick="deconnexion()" style="border-top:1px solid var(--border); margin-top:4px;">
      <span>🚪</span> Se déconnecter
    </button>
  </div>

  <!-- ONGLETS NAVIGATION -->
  <nav class="quick-nav">
    <a href="index.html">Scan & Fiche</a>
    <a href="reservation.html" class="active">Planning Résas</a>
    <a href="dashboard.html">Vue Parc</a>
  </nav>

  <!-- BLOC 1 : MES RÉSERVATIONS EN COURS -->
  <div class="card">
    <button type="button" class="accordion-toggle" onclick="toggleAccordeon()">
      <span>📋 Mes réservations en cours (<span id="nbResasPerso">0</span>)</span>
      <span id="flecheAccordeon">▼</span>
    </button>
    <div class="accordion-content" id="contenuAccordeon">
      <div id="loadingPerso" style="font-size:0.85em; color:var(--text-muted);">Chargement de vos réservations...</div>
      <div id="listeResasPerso"></div>
    </div>
  </div>

  <!-- BLOC 2 : NOUVELLE RÉSERVATION AVEC CATÉGORIES DÉPLIABLES -->
  <div class="card">
    <h3>Nouvelle Demande de Réservation</h3>
    
    <label>Nom du projet / Événement :</label>
    <input type="text" id="inputProjet" placeholder="ex: Concert Marseille, Captation Grand Plateau...">

    <div class="date-row">
      <div>
        <label>Date de départ :</label>
        <input type="date" id="inputDateDebut">
      </div>
      <div>
        <label>Date de retour :</label>
        <input type="date" id="inputDateFin">
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
      <label style="margin:0;">Catalogue matériel :</label>
      <div id="compteurSelection" class="selection-counter">0 sélectionné(s)</div>
    </div>

    <input type="text" id="searchMaterielInput" class="search-box" placeholder="🔍 Rechercher (nom, ID, micro, dmx...)" oninput="filtrerParcArborescent()">

    <!-- ARBORESCENCE DÉPLIABLE -->
    <div class="picker-box" id="pickerMateriel">Chargement du parc matériel...</div>

    <button type="button" class="btn-submit" id="btnResa" onclick="soumettreReservation()">Valider la Réservation</button>
  </div>

  <script>
    // COLLE TON URL APPS SCRIPT ICI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyr8qcBeM-V1sEBd8IX207mqJxyB_ibhrl_q7ST2uHCrgGPQOQ8CNyc5aogTBoZ1N1T/exec";

    let rawMateriel = [];
    const selectionIds = new Set(); // Maintient les ID cochés
    const user = localStorage.getItem("regie_user") || "Inconnu";
    const role = localStorage.getItem("regie_role") || "etudiant";

    document.getElementById("userName").innerText = user;
    document.getElementById("userRoleTxt").innerText = (role === "admin") ? "Administrateur" : "Étudiant";
    if (role === "admin") document.getElementById("adminMenuOptions").style.display = "block";

    function toggleUserMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById("userMenu");
      menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

    function fermerMenuSiClicExterieur(e) {
      const menu = document.getElementById("userMenu");
      if (menu && menu.style.display === "block" && !menu.contains(e.target)) menu.style.display = "none";
    }

    function deconnexion() {
      if (!confirm("Voulez-vous vraiment vous déconnecter ?")) return;
      localStorage.removeItem("regie_user");
      localStorage.removeItem("regie_role");
      location.href = "index.html";
    }

    function toggleAccordeon() {
      const el = document.getElementById("contenuAccordeon");
      const fleche = document.getElementById("flecheAccordeon");
      if (el.style.display === "none") {
        el.style.display = "block";
        fleche.innerText = "▼";
      } else {
        el.style.display = "none";
        fleche.innerText = "▶";
      }
    }

    // 1. CHARGEMENT DU PARC
    fetch(`${SCRIPT_URL}?action=getAll`)
      .then(r => r.json())
      .then(res => {
        if (res.success && res.items) {
          rawMateriel = res.items;
          rendreArborescence(rawMateriel, false);
        }
      });

    // 2. CONVERSION ET RENDU EN ACCORDÉONS HIÉRARCHIQUES
    function rendreArborescence(items, openAll = false) {
      const conteneur = document.getElementById("pickerMateriel");
      conteneur.innerHTML = "";

      if (!items || items.length === 0) {
        conteneur.innerHTML = '<div style="font-size:0.8em; color:var(--text-muted); padding:10px; text-align:center;">Aucun équipement trouvé.</div>';
        return;
      }

      // Structure : { [cat]: { [subCat]: [items] } }
      const tree = {};
      items.forEach(item => {
        const cat = item.categorie || "Autre";
        const sub = item.sousCategorie || "Général";
        if (!tree[cat]) tree[cat] = {};
        if (!tree[cat][sub]) tree[cat][sub] = [];
        tree[cat][sub].push(item);
      });

      // Tri alphabétique des catégories
      const sortedCats = Object.keys(tree).sort();

      sortedCats.forEach(cat => {
        const catDetails = document.createElement("details");
        catDetails.className = "cat-group";
        if (openAll) catDetails.open = true;

        let totalCatItems = 0;
        Object.values(tree[cat]).forEach(arr => totalCatItems += arr.length);

        const catSummary = document.createElement("summary");
        catSummary.innerHTML = `<span>📁 ${cat}</span> <span style="font-size:0.75em; color:var(--text-muted); font-family:'JetBrains Mono';">${totalCatItems}</span>`;
        catDetails.appendChild(catSummary);

        const sortedSubs = Object.keys(tree[cat]).sort();
        sortedSubs.forEach(sub => {
          const subDetails = document.createElement("details");
          subDetails.className = "subcat-group";
          if (openAll) subDetails.open = true;

          const subItems = tree[cat][sub];
          const subSummary = document.createElement("summary");
          subSummary.innerHTML = `<span>📂 ${sub}</span> <span style="font-size:0.75em; color:var(--text-muted); font-family:'JetBrains Mono';">${subItems.length}</span>`;
          subDetails.appendChild(subSummary);

          subItems.forEach(item => {
            const label = document.createElement("label");
            label.className = "picker-item";
            const isChecked = selectionIds.has(item.id);

            label.innerHTML = `
              <input type="checkbox" value="${item.id}" ${isChecked ? 'checked' : ''} onchange="toggleSelection(this)">
              <span class="code-tag">${item.id}</span>
              <span style="color:#fff;">${item.nom}</span>
            `;
            subDetails.appendChild(label);
          });

          catDetails.appendChild(subDetails);
        });

        conteneur.appendChild(catDetails);
      });
    }

    function toggleSelection(checkbox) {
      if (checkbox.checked) {
        selectionIds.add(checkbox.value);
      } else {
        selectionIds.delete(checkbox.value);
      }
      document.getElementById("compteurSelection").innerText = `${selectionIds.size} sélectionné(s)`;
    }

    function filtrerParcArborescent() {
      const q = document.getElementById("searchMaterielInput").value.trim().toLowerCase();

      if (!q) {
        rendreArborescence(rawMateriel, false);
        return;
      }

      // Filtre les items qui correspondent à la recherche
      const filtres = rawMateriel.filter(item => 
        (item.nom || "").toLowerCase().includes(q) ||
        (item.id || "").toLowerCase().includes(q) ||
        (item.categorie || "").toLowerCase().includes(q) ||
        (item.sousCategorie || "").toLowerCase().includes(q)
      );

      // Déplie automatiquement les accordéons quand on effectue une recherche
      rendreArborescence(filtres, true);
    }

    // 3. CHARGEMENT RÉSERVATIONS PERSONNELLES
    chargerMesReservations();

    function chargerMesReservations() {
      fetch(`${SCRIPT_URL}?action=getUserResas&demandeur=${encodeURIComponent(user)}`)
        .then(r => r.json())
        .then(res => {
          document.getElementById("loadingPerso").style.display = "none";
          const conteneur = document.getElementById("listeResasPerso");
          conteneur.innerHTML = "";

          if (res.success && res.reservations && res.reservations.length > 0) {
            document.getElementById("nbResasPerso").innerText = res.reservations.length;
            res.reservations.forEach(r => {
              const div = document.createElement("div");
              div.className = "resa-row";
              div.innerHTML = `
                <div>
                  <div style="font-weight:700; color:#fff; font-size:0.9em;">
                    ${r.nom} <span class="code-tag">${r.id}</span>
                  </div>
                  <div style="font-size:0.75em; color:var(--text-muted); margin-top:2px;">
                    Projet : <strong style="color:#cbd5e1;">${r.projet}</strong> &bull; Du ${r.debut} au ${r.fin}
                  </div>
                </div>
                <button type="button" class="btn-del" onclick="annulerReservation(${r.row})">Annuler</button>
              `;
              conteneur.appendChild(div);
            });
          } else {
            document.getElementById("nbResasPerso").innerText = "0";
            conteneur.innerHTML = '<div style="font-size:0.85em; color:var(--text-muted);">Aucune réservation active à votre nom.</div>';
          }
        });
    }

    function soumettreReservation() {
      const projet = document.getElementById("inputProjet").value.trim();
      const dDebut = document.getElementById("inputDateDebut").value;
      const dFin = document.getElementById("inputDateFin").value;
      const coches = Array.from(selectionIds);

      if (!projet || !dDebut || !dFin || coches.length === 0) {
        alert("Veuillez renseigner le nom du projet, les dates et sélectionner au moins un équipement.");
        return;
      }

      const btn = document.getElementById("btnResa");
      btn.disabled = true;
      btn.innerText = "Validation...";

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          actionType: "RESERVATION",
          demandeur: user,
          projet: projet,
          dateDebut: dDebut,
          dateFin: dFin,
          ids: coches
        })
      })
      .then(() => {
        alert("Réservation enregistrée avec succès !");
        location.reload();
      })
      .catch(err => {
        alert("Erreur réseau : " + err);
        btn.disabled = false;
        btn.innerText = "Valider la Réservation";
      });
    }

    function annulerReservation(row) {
      if (!confirm("Voulez-vous vraiment annuler cette réservation ?")) return;

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          actionType: "DELETE_RESA",
          row: row
        })
      })
      .then(() => {
        alert("Réservation supprimée !");
        location.reload();
      })
      .catch(err => alert("Erreur réseau : " + err));
    }
  </script>
</body>
</html>
