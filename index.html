<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Régie Stock - DNMADe</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #22c55e;
      --orange: #f97316;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 1rem; max-width: 700px; margin: 0 auto; }
    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 1rem; color: var(--accent); }
    
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .tab-btn { flex: 1; padding: 0.75rem; border: none; border-radius: 8px; background: var(--card); color: var(--text); cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: var(--accent); color: #000; }
    
    .panel { display: none; background: var(--card); border-radius: 12px; padding: 1rem; }
    .panel.active { display: block; }
    
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 1rem; }
    .form-group { margin-bottom: 0.8rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.2rem; }
    input, select { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
    .btn-submit { width: 100%; padding: 0.9rem; border: none; border-radius: 8px; background: var(--accent); color: #000; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 1rem; text-align: center; }
    .stat-box { background: #0f172a; padding: 0.7rem; border-radius: 8px; border: 1px solid #334155; }
    .stat-number { font-size: 1.2rem; font-weight: bold; }
    .item-card { background: #0f172a; border-radius: 8px; padding: 0.8rem; margin-bottom: 0.6rem; border-left: 5px solid var(--muted); }
    .item-card.dispo { border-left-color: var(--green); }
    .item-card.emprunt { border-left-color: var(--orange); }
    .item-card.sav { border-left-color: var(--red); }
    .item-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 0.3rem; }
    .badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
    .badge-dispo { background: #14532d; color: #4ade80; }
    .badge-emprunt { background: #7c2d12; color: #fdba74; }
    .badge-sav { background: #7f1d1d; color: #fca5a5; }
    .item-details { font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>

  <h1>⚡ Régie Stock</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('scan')">📷 Scanner / Sortir</button>
    <button class="tab-btn" onclick="switchTab('dashboard')">📋 Dashboard Régie</button>
  </div>

  <!-- PANNEAU SCANNER -->
  <div id="panel-scan" class="panel active">
    <div id="reader"></div>

    <form id="stock-form" onsubmit="submitForm(event)">
      <div class="form-group">
        <label>ID Matériel</label>
        <input type="text" id="item-id" required placeholder="ex: WASH_150_01">
      </div>
      <div class="form-group">
        <label>Action</label>
        <select id="item-action" onchange="toggleFields()">
          <option value="Emprunté">Sortie / Emprunt</option>
          <option value="Dispo">Retour au Stock / Flight</option>
          <option value="SAV">Signaler en Panne / SAV</option>
        </select>
      </div>
      <div class="form-group" id="group-loc">
        <label>Destination / Salle</label>
        <input type="text" id="item-loc" placeholder="ex: Plateau 1, Studio Son...">
      </div>
      
      <!-- CHAMP AVEC AUTOCOMPLÉTION DEPUIS LE SHEETS -->
      <div class="form-group" id="group-user">
        <label>Nom de l'étudiant</label>
        <input type="text" id="item-user" list="liste-etudiants" placeholder="Commence à taper ton prénom...">
        <datalist id="liste-etudiants"></datalist>
      </div>

      <div class="form-group" id="group-panne" style="display: none;">
        <label>Détail de la panne</label>
        <input type="text" id="item-panne" placeholder="ex: Lampe grillée, reset infini...">
      </div>
      <button type="submit" id="btn-submit" class="btn-submit">Enregistrer le mouvement</button>
    </form>
  </div>

  <!-- PANNEAU DASHBOARD -->
  <div id="panel-dashboard" class="panel">
    <div class="summary">
      <div class="stat-box"><div class="stat-number" style="color:var(--green);" id="count-dispo">0</div>Dispo</div>
      <div class="stat-box"><div class="stat-number" style="color:var(--orange);" id="count-emprunt">0</div>Sortis</div>
      <div class="stat-box"><div class="stat-number" style="color:var(--red);" id="count-sav">0</div>SAV</div>
    </div>
    <div id="items-list">Chargement des données...</div>
  </div>

  <script>
    // COLLE TON LIEN APPS SCRIPT CI-DESSOUS :
    const SCRIPT_URL = "VOTRE_URL_GOOGLE_APPS_SCRIPT_ICI";

    let html5QrCode = null;

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      
      if (tab === 'scan') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('panel-scan').classList.add('active');
        startScanner();
      } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('panel-dashboard').classList.add('active');
        stopScanner();
        loadDashboard();
      }
    }

    function toggleFields() {
      const action = document.getElementById('item-action').value;
      document.getElementById('group-loc').style.display = action === 'Emprunté' ? 'block' : 'none';
      document.getElementById('group-user').style.display = action === 'Emprunté' ? 'block' : 'none';
      document.getElementById('group-panne').style.display = action === 'SAV' ? 'block' : 'none';
    }

    function startScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decodedText) => {
          document.getElementById('item-id').value = decodedText.trim();
          stopScanner();
          if (navigator.vibrate) navigator.vibrate(80);
        },
        (error) => {}
      ).catch(err => console.log("Caméra en attente"));
    }

    function stopScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().catch(() => {});
      }
    }

    // Chargement dynamique de la liste des étudiants pour l'autocomplétion
    async function loadEtudiants() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        const datalist = document.getElementById('liste-etudiants');
        datalist.innerHTML = "";
        if (data.etudiants && data.etudiants.length > 0) {
          data.etudiants.forEach(nom => {
            const opt = document.createElement('option');
            opt.value = nom;
            datalist.appendChild(opt);
          });
        }
      } catch (e) {
        console.warn("Impossible de charger les étudiants", e);
      }
    }

    async function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = "Enregistrement en cours...";

      const payload = {
        id: document.getElementById('item-id').value,
        statut: document.getElementById('item-action').value,
        localisation: document.getElementById('item-loc').value,
        emprunteur: document.getElementById('item-user').value,
        panne: document.getElementById('item-panne').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert("✅ Mouvement enregistré dans l'historique !");
        document.getElementById('stock-form').reset();
        toggleFields();
        startScanner();
      } catch (err) {
        alert("Erreur lors de l'enregistrement : " + err);
      } finally {
        btn.disabled = false;
        btn.innerText = "Enregistrer le mouvement";
      }
    }

    async function loadDashboard() {
      const container = document.getElementById('items-list');
      container.innerHTML = "Actualisation...";
      
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        const items = data.items || [];
        
        let cDispo = 0, cEmprunt = 0, cSav = 0;
        container.innerHTML = "";

        items.forEach(item => {
          let cardClass = "dispo";
          let badgeClass = "badge-dispo";
          
          if (item.statut === "Emprunté") {
            cardClass = "emprunt";
            badgeClass = "badge-emprunt";
            cEmprunt++;
          } else if (item.statut === "SAV") {
            cardClass = "sav";
            badgeClass = "badge-sav";
            cSav++;
          } else {
            cDispo++;
          }

          container.innerHTML += `
            <div class="item-card ${cardClass}">
              <div class="item-header">
                <span>${item.nom} <small style="color:var(--muted)">(${item.id})</small></span>
                <span class="badge ${badgeClass}">${item.statut}</span>
              </div>
              <div class="item-details">
                ${item.statut === 'Emprunté' ? `📍 <b>${item.localisation}</b> par <b>${item.emprunteur}</b>` : ''}
                ${item.statut === 'Dispo' ? `Au stock / flight` : ''}
                ${item.statut === 'SAV' ? `⚠️ <b>Panne :</b> ${item.panne}` : ''}
                <div style="font-size:0.75rem; margin-top:4px;">Dernière maj : ${item.dateMaj}</div>
              </div>
            </div>
          `;
        });

        document.getElementById('count-dispo').innerText = cDispo;
        document.getElementById('count-emprunt').innerText = cEmprunt;
        document.getElementById('count-sav').innerText = cSav;

      } catch (err) {
        container.innerHTML = "Erreur lors du chargement des données.";
      }
    }

    // Démarrage
    window.addEventListener('DOMContentLoaded', () => {
      startScanner();
      loadEtudiants();
    });
  </script>
</body>
</html>
