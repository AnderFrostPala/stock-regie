<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Régie - Vue Parc & Sorties</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    
    :root {
      --bg-body: #0d0f12;
      --bg-surface: #171a21;
      --bg-surface-elevated: #20242e;
      --border: #292e3b;
      --text-main: #f1f3f7;
      --text-muted: #8b949e;
      
      --status-dispo: #10b981;
      --status-sorti: #ef4444;
      --status-sav: #f59e0b;
      --status-blue: #3b82f6;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      margin: 0 auto; max-width: 640px; background-color: var(--bg-body);
      color: var(--text-main); padding: 14px; -webkit-font-smoothing: antialiased;
    }

    /* HEADER */
    .app-header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .brand-group { display: flex; align-items: center; gap: 10px; }
    .brand-logo { height: 36px; max-width: 70px; object-fit: contain; }
    .brand-fallback {
      background: #fff; color: #000; font-weight: 900; font-size: 0.65em;
      line-height: 1; padding: 5px 6px; border-radius: 4px;
    }
    .brand-text h1 { margin: 0; font-size: 0.95em; font-weight: 800; color: #fff; }
    .brand-text span { display: block; font-size: 0.72em; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    
    .user-pill-btn {
      display: flex; align-items: center; gap: 7px; background: var(--bg-surface);
      border: 1px solid var(--border); padding: 6px 10px; border-radius: 20px;
      color: var(--text-main); cursor: pointer; font-size: 0.82em; font-weight: 600; font-family: inherit;
      transition: all 0.15s ease;
    }
    .user-pill-btn:hover { background: var(--bg-surface-elevated); }

    /* MENU UTILISATEUR */
    #userMenu {
      position: absolute; right: 14px; top: 62px; width: 220px;
      background: var(--bg-surface-elevated); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 0; z-index: 1000; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .menu-header { padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 0.8em; color: var(--text-muted); }
    .menu-item {
      display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 14px;
      background: none; border: none; color: var(--text-main); text-align: left;
      font-size: 0.86em; cursor: pointer; text-decoration: none; font-family: inherit;
    }
    .menu-item:hover { background: rgba(255,255,255,0.06); }
    .menu-item.danger { color: var(--status-sorti); }

    /* NAVIGATION */
    .quick-nav { display: flex; gap: 6px; margin-bottom: 14px; }
    .quick-nav a {
      flex: 1; text-align: center; padding: 7px 4px; border-radius: 6px;
      background: var(--bg-surface); border: 1px solid var(--border);
      color: var(--text-muted); text-decoration: none; font-size: 0.78em; font-weight: 700;
    }
    .quick-nav a.active { color: #fff; border-color: #4b5563; background: var(--bg-surface-elevated); }

    /* TUILES KPI */
    .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .kpi-card {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 4px; text-align: center; cursor: pointer; user-select: none;
      transition: all 0.15s ease;
    }
    .kpi-card:hover { background: var(--bg-surface-elevated); border-color: #3b4252; }
    .kpi-card.active { border-color: #fff; background: #1c202a; transform: translateY(-1px); }
    .kpi-num { font-size: 1.25em; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
    .kpi-lbl { font-size: 0.68em; text-transform: uppercase; color: var(--text-muted); margin-top: 2px; font-weight: 700; }

    /* RECHERCHE & FILTRES */
    .filter-card {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px;
    }
    input[type="text"] {
      width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border);
      background: #0d0f12; color: #fff; font-size: 14px; font-family: inherit;
    }
    input[type="text"]:focus { outline: none; border-color: var(--status-blue); }
    .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      background: #1f232c; border: 1px solid var(--border); color: var(--text-muted);
      padding: 5px 10px; border-radius: 20px; font-size: 0.76em; font-weight: 700; cursor: pointer;
    }
    .chip.active { background: #fff; color: #000; border-color: #fff; }

    /* CARTES LISTE */
    .item-card {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px;
    }
    .item-card.is-dispo { border-left: 5px solid var(--status-dispo); }
    .item-card.is-sorti { border-left: 5px solid var(--status-sorti); }
    .item-card.is-sav   { border-left: 5px solid var(--status-sav); }

    .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .item-name { font-weight: 700; font-size: 0.95em; color: #fff; }
    .code-tag {
      font-family: 'JetBrains Mono', monospace; font-size: 0.8em; font-weight: 700;
      background: #090a0d; border: 1px solid #232731; color: #38bdf8; padding: 1px 6px; border-radius: 4px;
    }
    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 0.72em;
      font-weight: 800; text-transform: uppercase;
    }
    .badge-dispo { background: rgba(16,185,129,0.15); color: #34d399; }
    .badge-sorti { background: rgba(239,68,68,0.15); color: #f87171; }
    .badge-sav   { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .badge-resa  { background: rgba(59,130,246,0.2); color: #60a5fa; margin-left: 4px; }
    
    .meta-line { font-size: 0.8em; color: var(--text-muted); display: flex; justify-content: space-between; }
    .btn-manual {
      color: #94a3b8; text-decoration: none; font-size: 0.75em; font-weight: 700;
      border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px;
    }
    .btn-manual:hover { background: rgba(255,255,255,0.06); color: #fff; }

    /* SEGMENTS DE QUANTITÉ VISUELS */
    .qte-bar {
      display: inline-flex; gap: 3px; align-items: center; vertical-align: middle; margin-left: 6px;
    }
    .qte-pip {
      width: 7px; height: 12px; border-radius: 2px;
      background: #2a313d; display: inline-block;
    }
    .qte-pip.filled {
      background: var(--status-dispo); box-shadow: 0 0 4px rgba(16,185,129,0.4);
    }
    .qte-pip.out {
      background: var(--status-sorti);
    }
  </style>
</head>
<body onclick="fermerMenuSiClicExterieur(event)">

  <header class="app-header">
    <div class="brand-group">
      <img src="logo-dnmade.png" alt="Logo DNMADe" class="brand-logo" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
      <div id="logoFallback" class="brand-fallback" style="display:none;">DN<br>MADE</div>
      <div class="brand-text">
        <h1>Suivi de Stock</h1>
        <span>DNMADe Marseille</span>
      </div>
    </div>
    <button type="button" class="user-pill-btn" onclick="toggleUserMenu(event)">
      <span style="width:7px; height:7px; border-radius:50%; background:var(--status-dispo);"></span>
      <span id="userName">...</span>
      <span style="font-size:0.7em; color:var(--text-muted);">▼</span>
    </button>
  </header>

  <div id="userMenu">
    <div class="menu-header">Profil : <strong id="userRoleTxt">Étudiant</strong></div>
    <a href="reservation.html" class="menu-item"><span>📅</span> Mes réservations</a>
    <div id="adminMenuOptions" style="display:none;">
      <a href="admin.html" class="menu-item" style="color:#f87171;"><span>⚙️</span> Panneau Admin</a>
      <a href="express.html" class="menu-item" style="color:#fbbf24;"><span>⚡</span> Déchargement Rapide</a>
    </div>
    <button type="button" class="menu-item danger" onclick="deconnexion()" style="border-top:1px solid var(--border); margin-top:4px;">
      <span>🚪</span> Se déconnecter
    </button>
  </div>

  <nav class="quick-nav">
    <a href="index.html">Scan & Fiche</a>
    <a href="reservation.html">Planning Résas</a>
    <a href="dashboard.html" class="active">Vue Parc</a>
  </nav>

  <!-- TUILES KPI -->
  <div class="kpi-row">
    <div class="kpi-card" id="kpiCardResa" onclick="clicKpi('RESA')">
      <div class="kpi-num" style="color: var(--status-blue);" id="kpiResa">-</div>
      <div class="kpi-lbl">Réservés</div>
    </div>
    <div class="kpi-card" id="kpiCardDispo" onclick="clicKpi('STOCK')">
      <div class="kpi-num" style="color: var(--status-dispo);" id="kpiDispo">-</div>
      <div class="kpi-lbl">Au Stock</div>
    </div>
    <div class="kpi-card" id="kpiCardSorti" onclick="clicKpi('SORTIS')">
      <div class="kpi-num" style="color: var(--status-sorti);" id="kpiSorti">-</div>
      <div class="kpi-lbl">Sortis</div>
    </div>
    <div class="kpi-card" id="kpiCardSav" onclick="clicKpi('SAV')">
      <div class="kpi-num" style="color: var(--status-sav);" id="kpiSav">-</div>
      <div class="kpi-lbl">SAV</div>
    </div>
  </div>

  <!-- RECHERCHE & CHIPS -->
  <div class="filter-card">
    <input type="text" id="searchInput" oninput="filtrerInventaire()" placeholder="Rechercher par nom, ID, référence...">
    <div class="filter-chips">
      <div class="chip active" id="chip-TOUS" onclick="setFiltreStatut('TOUS', this)">Tous</div>
      <div class="chip" id="chip-RESA" onclick="setFiltreStatut('RESA', this)">Réservés</div>
      <div class="chip" id="chip-STOCK" onclick="setFiltreStatut('STOCK', this)">Au stock</div>
      <div class="chip" id="chip-SORTIS" onclick="setFiltreStatut('SORTIS', this)">Sortis</div>
      <div class="chip" id="chip-SAV" onclick="setFiltreStatut('SAV', this)">En panne</div>
    </div>
  </div>

  <div id="loading" style="text-align:center; padding:20px; font-size:0.85em; color:var(--text-muted);">Chargement du parc matériel...</div>
  <div id="listeMateriel"></div>

  <script>
    // COLLE TON URL APPS SCRIPT ICI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyr8qcBeM-V1sEBd8IX207mqJxyB_ibhrl_q7ST2uHCrgGPQOQ8CNyc5aogTBoZ1N1T/exec";

    let rawItems = [];
    let filtreStatutCourant = "TOUS";
    const user = localStorage.getItem("regie_user") || "Inconnu";
    const role = localStorage.getItem("regie_role") || "etudiant";

    document.getElementById("userName").innerText = user;
    document.getElementById("userRoleTxt").innerText = (role === "admin") ? "Administrateur" : "Étudiant";
    if (role === "admin") document.getElementById("adminMenuOptions").style.display = "block";

    function toggleUserMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById("userMenu");
      menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

    function fermerMenuSiClicExterieur(e) {
      const menu = document.getElementById("userMenu");
      if (menu && menu.style.display === "block" && !menu.contains(e.target)) menu.style.display = "none";
    }

    function deconnexion() {
      if (!confirm("Voulez-vous vraiment vous déconnecter ?")) return;
      localStorage.removeItem("regie_user");
      localStorage.removeItem("regie_role");
      location.href = "index.html";
    }

    // CHARGEMENT DU PARC COMPLET
    fetch(`${SCRIPT_URL}?action=getAll`)
      .then(r => r.json())
      .then(res => {
        document.getElementById("loading").style.display = "none";
        if (res.success) {
          rawItems = res.items || [];
          calculerKpis(rawItems);
          filtrerInventaire();
        } else {
          document.getElementById("loading").innerText = res.message || "Erreur de chargement.";
          document.getElementById("loading").style.display = "block";
        }
      })
      .catch(err => {
        document.getElementById("loading").innerText = "Erreur de connexion au serveur.";
      });

    function calculerKpis(items) {
      const nbResa = items.filter(i => {
        const r = (i.statutResa || "").toLowerCase();
        return (r.includes("réservé") || r.includes("reserve")) && !r.includes("non");
      }).length;

      const nbDispo = items.filter(i => (i.statut || "").toLowerCase().includes("dispo")).length;
      const nbSorti = items.filter(i => (i.statut || "").toLowerCase().includes("sorti")).length;
      const nbSav   = items.filter(i => (i.statut || "").toLowerCase().includes("sav")).length;

      document.getElementById("kpiResa").innerText = nbResa;
      document.getElementById("kpiDispo").innerText = nbDispo;
      document.getElementById("kpiSorti").innerText = nbSorti;
      document.getElementById("kpiSav").innerText   = nbSav;
    }

    function clicKpi(filtre) {
      const cible = (filtreStatutCourant === filtre) ? "TOUS" : filtre;
      const chipEl = document.getElementById("chip-" + cible);
      setFiltreStatut(cible, chipEl);
    }

    function setFiltreStatut(filtre, el) {
      filtreStatutCourant = filtre;

      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      if (el) el.classList.add("active");

      document.querySelectorAll(".kpi-card").forEach(k => k.classList.remove("active"));
      if (filtre === "RESA")   document.getElementById("kpiCardResa").classList.add("active");
      if (filtre === "STOCK")  document.getElementById("kpiCardDispo").classList.add("active");
      if (filtre === "SORTIS") document.getElementById("kpiCardSorti").classList.add("active");
      if (filtre === "SAV")    document.getElementById("kpiCardSav").classList.add("active");

      filtrerInventaire();
    }

    function filtrerInventaire() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const conteneur = document.getElementById("listeMateriel");
      conteneur.innerHTML = "";

      const itemsFiltres = rawItems.filter(item => {
        const matchTexte = (item.nom || "").toLowerCase().includes(q) ||
                           (item.id || "").toLowerCase().includes(q) ||
                           (item.ref || "").toLowerCase().includes(q);
        if (!matchTexte) return false;

        const st = (item.statut || "").toLowerCase();
        const r = (item.statutResa || "").toLowerCase();
        const estResa = (r.includes("réservé") || r.includes("reserve")) && !r.includes("non");

        if (filtreStatutCourant === "SORTIS") return st.includes("sorti");
        if (filtreStatutCourant === "STOCK")  return st.includes("dispo");
        if (filtreStatutCourant === "SAV")    return st.includes("sav");
        if (filtreStatutCourant === "RESA")   return estResa;
        return true;
      });

      if (itemsFiltres.length === 0) {
        conteneur.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:0.85em;">Aucun matériel trouvé.</div>';
        return;
      }

      itemsFiltres.forEach(item => {
        const st = (item.statut || "").toLowerCase();
        let carteClass = "is-dispo";
        let badgeHtml = '<span class="badge badge-dispo">Au stock</span>';

        if (st.includes("sorti")) {
          carteClass = "is-sorti";
          badgeHtml = '<span class="badge badge-sorti">Sorti</span>';
        } else if (st.includes("sav")) {
          carteClass = "is-sav";
          badgeHtml = '<span class="badge badge-sav">SAV</span>';
        }

        const r = (item.statutResa || "").toLowerCase();
        const estResa = (r.includes("réservé") || r.includes("reserve")) && !r.includes("non");
        const resaBadge = estResa ? '<span class="badge badge-resa">📅 Réservé</span>' : '';
        const manuelLink = (item.docUrl && item.docUrl.startsWith("http")) 
          ? `<a href="${item.docUrl}" target="_blank" class="btn-manual">📄 Manuel</a>` : '';

        // Segments visuels pour quantité multiple (> 1)
        const qteTotale = parseInt(item.qte, 10) || 1;
        let qteVisuelleHtml = "";

        if (qteTotale > 1) {
          const pipClass = st.includes("sorti") ? "qte-pip out" : "qte-pip filled";
          let pips = "";
          const nbPips = Math.min(qteTotale, 10);
          for (let p = 0; p < nbPips; p++) {
            pips += `<span class="${pipClass}"></span>`;
          }
          qteVisuelleHtml = `
            <span class="qte-bar" title="Lot de ${qteTotale} unités">
              ${pips}
              <span style="font-size:0.75em; font-family:'JetBrains Mono', monospace; margin-left:4px; color:var(--text-muted);">x${qteTotale}</span>
            </span>
          `;
        }

        const div = document.createElement("div");
        div.className = `item-card ${carteClass}`;
        div.innerHTML = `
          <div class="item-top">
            <div>
              <span class="item-name">${item.nom}</span> ${qteVisuelleHtml}
              <div style="margin-top:2px;"><span class="code-tag">${item.id}</span></div>
            </div>
            <div>${badgeHtml}${resaBadge}</div>
          </div>
          <div class="meta-line">
            <span>Lieu : <strong style="color:#fff;">${item.localisation || "Stock"}</strong></span>
            <span>${item.emprunteur && item.emprunteur !== '-' ? 'Par : <strong style="color:#fff;">' + item.emprunteur + '</strong>' : ''}</span>
          </div>
          ${manuelLink ? `<div style="display:flex; justify-content:flex-end;">${manuelLink}</div>` : ''}
        `;
        conteneur.appendChild(div);
      });
    }
  </script>
</body>
</html>
