<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TurboStock — Impression Étiquettes QR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 15px;
      background: #f1f3f7;
      color: #000;
    }
    
    .no-print {
      max-width: 800px;
      margin: 0 auto 20px auto;
      background: #fff;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-print {
      background: #e62b33;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.95em;
      cursor: pointer;
    }

    /* GRILLE D'ÉTIQUETTES (Format grille de 3 par ligne sur A4) */
    .labels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* CARTE D'ÉTIQUETTE INDIVIDUELLE */
    .label-card {
      border: 1.5px dashed #4b5563; /* Pointillés pour découper aux ciseaux */
      background: #fff;
      padding: 10px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      page-break-inside: avoid;
    }

    .label-header {
      font-size: 0.65em;
      font-weight: 800;
      color: #e62b33;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .label-nom {
      font-size: 0.85em;
      font-weight: 800;
      margin: 0 0 6px 0;
      line-height: 1.2;
      height: 2.4em; /* Garde 2 lignes max alignées */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .label-qr {
      width: 110px;
      height: 110px;
      margin: 4px 0;
    }
    .label-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
      font-weight: 700;
      background: #eee;
      padding: 2px 8px;
      border-radius: 4px;
      margin-top: 4px;
    }

    /* RÈGLES SPÉCIFIQUES POUR L'IMPRIMANTE / PDF */
    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .no-print {
        display: none;
      }
      .labels-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        width: 100%;
        max-width: none;
      }
      .label-card {
        border: 1px dashed #999;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <div>
      <strong>Planche d'impression TurboStock</strong>
      <div style="font-size:0.8em; color:#666;">Prêt pour impression A4 ou export PDF</div>
    </div>
    <button class="btn-print" onclick="window.print()">🖨️ Imprimer les étiquettes</button>
  </div>

  <div class="labels-grid" id="container">
    <div style="grid-column: 1 / -1; text-align: center; padding: 40px;">Chargement du parc matériel...</div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyr8qcBeM-V1sEBd8IX207mqJxyB_ibhrl_q7ST2uHCrgGPQOQ8CNyc5aogTBoZ1N1T/exec";

    fetch(`${SCRIPT_URL}?action=getAll`)
      .then(r => r.json())
      .then(res => {
        const container = document.getElementById("container");
        container.innerHTML = "";
        
        if (!res.success || !res.items || res.items.length === 0) {
          container.innerHTML = "<p>Aucun matériel trouvé dans la feuille.</p>";
          return;
        }

        res.items.forEach(item => {
          const urlScan = `https://anderfrostpala.github.io/stock-regie/index.html?id=${encodeURIComponent(item.id)}`;
          const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(urlScan)}`;

          const card = document.createElement("div");
          card.className = "label-card";
          card.innerHTML = `
            <div class="label-header">TurboStock • DNMADe</div>
            <div class="label-nom">${item.nom}</div>
            <img class="label-qr" src="${qrUrl}" alt="QR ${item.id}">
            <div class="label-id">${item.id}</div>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        document.getElementById("container").innerHTML = `<p style="color:red">Erreur chargement : ${err}</p>`;
      });
  </script>
</body>
</html>
